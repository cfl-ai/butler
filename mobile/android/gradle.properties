# file.encoding=UTF-8 是必须的，不是可选项：
# 本机 JDK 17 默认按系统区域（GBK）写文件，而 path_provider_android 引入的
# jni 插件把 CMake 输出目录建在用户目录下（C:\Users\陈富林\...\.cxx），
# AGP 写出的 android_gradle_build.json 就带上了 GBK 字节，
# 再按 UTF-8 读回时抛 MalformedJsonException（$.buildFiles[0] 非法转义）。
# 强制 UTF-8 后写入与读回编码一致，构建才成立。
# 本机只有 15.7GB 内存，且常年被 IDE/Agent/Ollama 视觉模型占着。
# 原先的 -Xmx8G 会让 Gradle 守护进程被系统直接杀掉
# （"Gradle build daemon disappeared unexpectedly"），必须按实机收紧。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
# 本机 Windows 上 Kotlin 增量编译缓存在关闭阶段会被文件锁/杀软拦截
# （Could not close incremental caches ... class-fq-name-to-source.tab），
# 直接禁用增量：构建慢一点，但不会随机失败。
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
