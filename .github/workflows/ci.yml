# AI 管家 Agent 生态体系 —— CI 流水线
# 计划书依据：三、P0-2
#   「制定 Git 分支规范、CI 自动构建、自动部署流水线」
#   「对接 Harness 自进化体系，评测数据自动流入迭代闭环」
#
# 平台选型：GitHub Actions（2026-10-23 改，用户指令「用GitHub不用gitea」，登记 U54）。
#   沿革：U11 曾裁定 Gitea + act_runner，依据是「github.com 在本机与工具链均不可达」。
#   该判定对**主站与 git 端点**精确成立（直连/代理/SSH 22/ssh.github.com:443 全域不通，
#   `git ls-remote` 实测 Empty reply），但 api.github.com 可达（200）。
#   最终形态：代码由使用者在可访问 github 的终端自行推送；CI 完全跑在 GitHub 托管的
#   runner 上 —— 本机不需要任何 runner，外部 action（checkout/setup-python 等）与
#   docker.io 镜像均可直接用，回到计划书原生的 GitHub Actions 形态。
#   服务镜像因此从 daocloud 镜像源改回 canonical 名（GitHub runner 侧无此约束）。
#
# 与计划书四环境隔离的对应：CI 只跑 test 环境；预发布/生产由部署流水线单独触发。
#
# 步骤顺序有一条**硬要求**：装依赖必须排在「生成 .env.test」之前。
#   生成脚本 import cryptography，而它来自 requirements.txt ——
#   顺序反了 CI 会在第一次运行就 ImportError（本项目真踩过，见 MEMORY E-26）。
#   tests/test_ci_pipeline.py 会守住这一条。

name: CI

on:
  push:
    branches: [main, develop, "release/**", "feature/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

env:
  AIBUTLER_ENV: .env.test
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: 测试（Python 3.12）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aibutler
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aibutler_test
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U aibutler -d aibutler_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6382:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 必须排在「生成四环境配置文件」之前：那一步要 import cryptography。
      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成四环境配置文件
        run: |
          python - <<'PY'
          import pathlib, secrets
          from cryptography.fernet import Fernet
          from ai_butler.core.environments import ENVIRONMENTS

          # 真值源是 core/environments.py 的 ENVIRONMENTS：端口 / 库名 / 数据目录 /
          # 容器前缀 / 是否发布宿主端口全部由它派生，CI 不另写一份（防两处口径分叉）。
          # 四份文件都要生成：tests/test_environments.py 校验的是**四环境之间的隔离**，
          # 只给 .env.test 会让 5 个守护报「缺少 .env.dev」。
          tpl = pathlib.Path(".env.example").read_text(encoding="utf-8").splitlines()

          for name, env in ENVIRONMENTS.items():
              overrides = {
                  "ENVIRONMENT": name,
                  "ENV_FILE_NAME": env.env_file,
                  "COMPOSE_PROJECT_NAME": env.project_name,
                  "CONTAINER_PREFIX": env.container_prefix,
                  "DATA_ROOT": f"../../{env.data_root}",
                  "DATA_PLANE_INTERNAL": "true" if env.data_plane_internal else "false",
                  "POSTGRES_USER": "aibutler",
                  # test 必须与 services.postgres 的密码逐字一致，否则测试连不上库；
                  # 另外三个环境各用独立随机值（四环境密钥不得复用，守护会逐一比对）。
                  "POSTGRES_PASSWORD": ("ci-only-password" if name == "test"
                                        else secrets.token_urlsafe(24)),
                  "POSTGRES_DB": env.postgres_db,
                  "POSTGRES_HOST": "127.0.0.1",
                  "POSTGRES_PORT": str(env.postgres_port),
                  "API_PORT": str(env.api_port),
                  "POSTGRES_IMAGE": "pgvector/pgvector:pg16",
                  "REDIS_HOST": "127.0.0.1",
                  "REDIS_PORT": str(env.redis_port),
                  "REDIS_DB": "0",
                  "REDIS_IMAGE": "redis:7-alpine",
                  "API_IMAGE": f"aibutler-api:{name}",
                  # 路径类字段的默认值是 data/dev/*，必须按环境显式派生，
                  # 否则测试会写进 dev 数据目录（跨环境串味）。
                  "WIKI_ROOT": f"{env.data_root}/agent_wiki",
                  "STORAGE_ROOT": f"{env.data_root}/storage",
                  "PG_CPUS": "1.0", "PG_MEMORY": "512m",
                  "REDIS_CPUS": "0.5", "REDIS_MEMORY": "256m",
                  "API_CPUS": "2.0", "API_MEMORY": "1g",
                  "SESSION_TTL_SECONDS": "43200",
                  "SESSION_IDLE_TIMEOUT_SECONDS": "7200",
                  "SESSION_REFRESH_AHEAD_SECONDS": "1800",
                  "SESSION_TOKEN_SECRET": secrets.token_hex(32),
                  "FIELD_ENCRYPTION_KEY": Fernet.generate_key().decode(),
                  # dev/test 持有本地开发凭据；staging/prod 显式留空。
                  # 空值必须写成 `KEY=` 行（读取侧直接索引，缺行会 KeyError），
                  # 这与「模板留空因此不写」是两回事 —— 覆盖表里写什么就落什么。
                  "DEEPSEEK_API_KEY": ("ci-placeholder-not-a-real-key"
                                       if name in ("dev", "test") else ""),
                  "LLM_PROVIDER_ORDER": "ollama",
                  "OLLAMA_BASE_URL": "http://127.0.0.1:11434",
                  "OLLAMA_MODEL": "qwen2.5vl:3b",
                  "DEEPSEEK_MODEL": "deepseek-chat",
                  "DASHSCOPE_MODEL": "qwen3.8-flash",
              }
              out, skipped = [], []
              for line in tpl:
                  if "=" not in line or line.startswith("#"):
                      out.append(line); continue
                  key, _, tpl_value = line.partition("=")
                  if key in overrides:
                      out.append(f"{key}={overrides[key]}")
                  elif tpl_value.strip():
                      out.append(line)
                  else:
                      # 模板留空 ≠ 「设成空串」：写 `KEY=` 会用空字符串覆盖 Settings 的默认值，
                      # 带类型的字段（int/bool/float）当场解析失败。模板留空的键一律不写，
                      # 让 pydantic 回落到字段默认值。CI 曾因此在 Settings 上炸 26 个校验错误。
                      skipped.append(key)
              # 覆盖表里可能有模板**根本没有**的键（API_PORT 就是这样：它由
              # environments.api_port 派生，.env.example 里没这一行）。只遍历模板
              # 会让这些键永远进不了文件，而 compose 恰好引用它们。
              present = {line.partition("=")[0] for line in out
                         if "=" in line and not line.startswith("#")}
              for key, value in overrides.items():
                  if key not in present:
                      out.append(f"{key}={value}")
              pathlib.Path(env.env_file).write_text(
                  "\n".join(out) + "\n", encoding="utf-8")
              print(f"{env.env_file}: 显式 {len(overrides)} 键，跳过 {len(skipped)} 个模板空键")
          PY

      - name: 契约与单元测试（含越权隔离、会话过期、Jev 边界、Wiki 隔离专项）
        run: python -m pytest -q --tb=short

      # 复现「没装约 2GB 的 torch 系依赖」的 CI 依赖面：
      # 凡在模块顶层 import torch / sentence_transformers / transformers 的代码会当场暴露。
      - name: 模拟 CI 依赖面测试（无重型 ML 依赖）
        env:
          AIBUTLER_BLOCK_ML: "1"
        run: python -m pytest -q --tb=short

      - name: 全场景测试用例库覆盖率检查
        run: |
          python - <<'PY'
          from ai_butler.devkit.scenario_library import default_library
          lib = default_library()
          print(lib.to_text())
          missing = lib.missing_categories()
          assert not missing, f"计划书要求的六类场景存在空白：{missing}"
          PY

      - name: P0-1 底座端到端冒烟
        run: python scripts/smoke_p0.py

      - name: P1–P4 端到端冒烟（真实 PostgreSQL + Redis 串起四个阶段的模块）
        run: python scripts/smoke_p1_p4.py

      # 端侧语音的引擎层与推理层**有意不进 CI**（tests/test_ci_pipeline.py 的
      # NOT_IN_CI 登记了完整理由）：它需要 sherpa-onnx 原生推理包与
      # models/kws-zipformer-wenetspeech-3.3M 全套（models/ 整体 gitignore），
      # 两项都不在 CI 依赖面内。真机层（麦克风权限/保活/功耗，U23）同样不在此覆盖，
      # 由 scripts/verify_android_artifact.py 在构建产物上单独校验。
      # 本地验证：.venv + models/ 就绪后 `python scripts/verify_voice_engine.py`。

      - name: 评测数据导出（供 Harness 离线链路消费，已剥离用户身份）
        run: |
          python - <<'PY'
          import json, pathlib
          from ai_butler.devkit.evaluation import Evaluator, RunRecord
          records = [RunRecord(task_id="ci", user_id="ci-user", answer="A", expected="A")]
          path = Evaluator().export_for_harness(records, path=pathlib.Path("eval-export.json"))
          print(open(path, encoding="utf-8").read())
          PY

      - name: 上传评测产物
        uses: actions/upload-artifact@v4
        with:
          name: eval-export
          path: eval-export.json

  # 纯 Dart 业务核心单独一个 job：它**零原生依赖**，不需要 Flutter SDK，
  # 所以能在普通 Linux runner 上直接跑。含端侧语音编排、会话、缓存、上报。
  dart-core:
    name: 测试（Dart 业务核心）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: 依赖解析
        working-directory: mobile/packages/aibutler_core
        run: dart pub get

      - name: 静态分析
        working-directory: mobile/packages/aibutler_core
        run: dart analyze --fatal-infos

      - name: 单元测试
        working-directory: mobile/packages/aibutler_core
        run: dart test
